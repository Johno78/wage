<title>Weekly Earnings Calculator</title>
<style>
  :root{
    --ink:#14161c;
    --panel:#1e222c;
    --panel-2:#262b37;
    --line:#333949;
    --text:#eceef2;
    --muted:#8b93a7;
    --amber:#f2a63d;
    --amber-dim:#f2a63d33;
    --teal:#5ec8b0;
    --red:#e0616b;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  header{margin-bottom:28px;}
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
  }
  .brand-icon{width:20px;height:20px;flex:none;}
  .brand-label{
    font-family:'JetBrains Mono','Courier New',monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .eyebrow{
    font-family:'JetBrains Mono','Courier New',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
    margin:0 0 8px;
  }
  h1{
    font-family:'Space Grotesk','Inter',sans-serif;
    font-size:30px;
    font-weight:700;
    letter-spacing:-.01em;
    margin:0 0 6px;
  }
  .sub{color:var(--muted);font-size:14px;line-height:1.5;margin:0;}

  .rate-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  .rate-card > div{display:flex;flex-direction:column;gap:4px;}
  .rate-card label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .rate-input-group{display:flex;align-items:baseline;gap:6px;}
  .rate-input-group span{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--muted);}
  input[type="number"].rate{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--amber);
    font-family:'JetBrains Mono',monospace;
    font-size:22px;
    font-weight:700;
    width:90px;
    padding:2px 0;
    text-align:right;
  }
  input[type="number"].rate:focus{outline:none;border-bottom-color:var(--amber);}
  input[type="date"].week-date{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    padding:2px 0;
  }
  input[type="date"].week-date:focus{outline:none;border-bottom-color:var(--amber);}

  .day{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
    transition:border-color .15s, opacity .15s;
  }
  .day.off{opacity:.45;}
  .day.holiday{border-color:var(--teal);}
  .day-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .day-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
  }
  .mode-switch{
    display:flex;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    flex:none;
  }
  .mode-switch button{
    background:transparent;
    border:none;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:.02em;
    padding:6px 10px;
    cursor:pointer;
  }
  .mode-switch button + button{border-left:1px solid var(--line);}
  .mode-switch button.active[data-mode="work"]{background:var(--amber-dim);color:var(--amber);}
  .mode-switch button.active[data-mode="holiday"]{background:#5ec8b033;color:var(--teal);}
  .mode-switch button.active[data-mode="off"]{background:var(--panel);color:var(--text);}

  .day-hours{
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    color:var(--teal);
    white-space:nowrap;
  }
  .day-fields{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .field label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  input[type="time"], input[type="number"].brk{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    padding:6px 8px;
    width:100px;
  }
  input[type="number"].brk{width:70px;}
  input[type="time"]:focus, input[type="number"].brk:focus{outline:none;border-color:var(--amber);}
  input[type="number"].holiday-hrs{width:80px;}

  .holiday-bar{
    margin-top:10px;
    height:14px;
    border-radius:3px;
    background:linear-gradient(90deg,var(--teal),#5ec8b088);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#0d2420;
  }

  .options-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin:14px 0 20px;
    font-size:12px;
    color:var(--muted);
  }
  .options-row input[type="checkbox"]{
    accent-color:var(--teal);
    width:15px;height:15px;
  }

  .bar{
    margin-top:10px;
    height:14px;
    background:var(--panel-2);
    border-radius:3px;
    position:relative;
    overflow:hidden;
  }
  .bar-fill{
    position:absolute;
    top:0;bottom:0;
    background:linear-gradient(90deg,var(--amber),var(--teal));
    border-radius:3px;
    transition:left .15s, width .15s;
  }
  .bar-ticks{
    position:absolute;
    inset:0;
    display:flex;
  }
  .bar-ticks span{
    flex:1;
    border-right:1px solid #ffffff0f;
  }
  .bar-ticks span:last-child{border-right:none;}

  .summary{
    position:sticky;
    bottom:16px;
    margin-top:24px;
    background:var(--panel);
    border:1px solid var(--amber);
    border-radius:var(--radius);
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 10px 30px -10px #000a;
  }
  .summary-block{display:flex;flex-direction:column;gap:2px;}
  .summary-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .summary-value{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;}
  .summary-value.pay{color:var(--amber);font-size:26px;}
  .summary-divider{width:1px;height:36px;background:var(--line);}

  .contracted-banner{
    margin-top:10px;
    padding:12px 16px;
    border-radius:8px;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .contracted-banner.over{background:var(--teal-dim,#5ec8b033);border:1px solid var(--teal);color:var(--teal);}
  .contracted-banner.under{background:var(--red-dim,#e0616b33);border:1px solid var(--red);color:var(--red);}
  .contracted-banner.match{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);}
  .contracted-banner .cb-value{font-family:'JetBrains Mono',monospace;font-weight:700;}

  .payperiod-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:20px;
  }
  .payperiod-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .pp-nav{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    width:32px;height:32px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    flex:none;
  }
  .pp-nav:hover{border-color:var(--amber);color:var(--amber);}
  .payperiod-main{flex:1;text-align:center;}
  .pp-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:2px;
  }
  .pp-range{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:700;
  }
  .pp-dates{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-top:10px;
    font-size:12px;
    color:var(--muted);
  }
  .pp-dates div{display:flex;align-items:center;gap:6px;}
  .pp-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .pp-dot.cutoff{background:var(--red);}
  .pp-dot.payday{background:var(--teal);}
  .pp-dates span:last-child{color:var(--text);font-family:'JetBrains Mono',monospace;}

  .export-row{
    display:flex;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .export-btn{
    flex:1;
    min-width:150px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:12px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .export-btn:hover{border-color:var(--amber);}
  .export-btn.primary{
    background:var(--amber);
    color:#1a1408;
    border-color:var(--amber);
  }
  .export-btn.primary:hover{opacity:.9;}
  .export-hint{
    text-align:center;
    font-size:12px;
    color:var(--teal);
    margin:10px 0 0;
    min-height:16px;
  }

  footer{
    text-align:center;
    margin-top:28px;
    font-size:12px;
    color:var(--muted);
    line-height:1.6;
  }
  footer button{
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    font-size:12px;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
  }
  footer button:hover{border-color:var(--amber);color:var(--amber);}

  @media (max-width:420px){
    .day-fields{gap:8px;}
    input[type="time"]{width:88px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="17" stroke="#f2a63d" stroke-width="2.5"/>
        <path d="M20 10v10l7 4" stroke="#5ec8b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-label">Timesheet</span>
    </div>
    <p class="eyebrow">Timesheet → Pay</p>
    <h1>Weekly Earnings</h1>
    <p class="sub">Set your hourly rate, mark the days you're working, and enter start / finish times. Your pay updates as you go.</p>
  </header>

  <div class="rate-card">
    <div>
      <label for="weekStartInput">Week starting</label>
      <input type="date" id="weekStartInput" class="week-date">
    </div>
    <div>
      <label for="rateInput">Hourly rate</label>
      <div class="rate-input-group">
        <span>£</span>
        <input type="number" id="rateInput" class="rate" step="0.01" min="0" value="15.01">
      </div>
    </div>
    <div>
      <label for="locationInput">+ Location pay /hr</label>
      <div class="rate-input-group">
        <span>£</span>
        <input type="number" id="locationInput" class="rate" step="0.01" min="0" value="0.90">
      </div>
    </div>
    <div>
      <label for="contractedHoursInput">Contracted hours /wk</label>
      <input type="number" id="contractedHoursInput" class="week-date" step="0.5" min="0" placeholder="e.g. 20.5" style="width:100px;">
    </div>
  </div>

  <div class="payperiod-card">
    <div class="payperiod-row">
      <button type="button" class="pp-nav" id="ppPrev" title="Previous pay period">‹</button>
      <div class="payperiod-main">
        <div class="pp-label">4-Week Pay Period</div>
        <div class="pp-range" id="ppRange">–</div>
      </div>
      <button type="button" class="pp-nav" id="ppNext" title="Next pay period">›</button>
    </div>
    <div class="pp-dates">
      <div><span class="pp-dot cutoff"></span>Cut-off <span id="ppCutoff">–</span></div>
      <div><span class="pp-dot payday"></span>Pay date <span id="ppPayday">–</span></div>
    </div>
  </div>

  <label class="options-row">
    <input type="checkbox" id="roundClockInput" checked>
    Round to 15-min clocking blocks (3 min grace: late arrivals within grace round down, early finishes within grace round up — otherwise it rounds against you)
  </label>

  <div id="days"></div>

  <label class="options-row">
    <input type="checkbox" id="holidayLocationInput" checked>
    Include location pay in holiday pay
  </label>

  <div class="summary">
    <div class="summary-block">
      <span class="summary-label">Hours</span>
      <span class="summary-value" id="totalHours">0.0</span>
      <span class="summary-label" id="hoursBreakdown" style="text-transform:none;font-size:11px;"></span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-block">
      <span class="summary-label">Total pay</span>
      <span class="summary-value pay" id="totalPay">£0.00</span>
      <span class="summary-label" id="payBreakdown" style="text-transform:none;font-size:11px;"></span>
    </div>
  </div>

  <div id="contractedBanner" style="display:none;"></div>

  <div class="export-row">
    <button id="shareBtn" class="export-btn primary">Save / Share week</button>
    <button id="downloadBtn" class="export-btn">Download as text file</button>
  </div>
  <p class="export-hint" id="exportHint"></p>

  <footer>
    Numbers only, nothing personal stored beyond your own browser.
    <br>
    <button id="resetBtn">Reset to blank week</button>
  </footer>
</div>

<script>
  const DAY_NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

  // Default example shifts — fully editable, nothing personal.
  // mode: "off" | "work" | "holiday"
  const DEFAULTS = {
    Monday:    { mode:"off",  start:"17:30", end:"22:00", brk:0,  holidayHours:4.5 },
    Tuesday:   { mode:"off",  start:"17:30", end:"22:00", brk:0,  holidayHours:4.5 },
    Wednesday: { mode:"off",  start:"17:30", end:"22:00", brk:0,  holidayHours:4.5 },
    Thursday:  { mode:"work", start:"18:30", end:"23:00", brk:0,  holidayHours:4.5 },
    Friday:    { mode:"work", start:"17:30", end:"22:00", brk:0,  holidayHours:4.5 },
    Saturday:  { mode:"work", start:"17:30", end:"22:00", brk:0,  holidayHours:4.5 },
    Sunday:    { mode:"work", start:"14:00", end:"22:00", brk:60, holidayHours:7.0 },
  };

  const STORAGE_KEY = "weekly-earnings-calculator-v1";
  const daysEl = document.getElementById("days");
  const rateInput = document.getElementById("rateInput");
  const locationInput = document.getElementById("locationInput");
  const holidayLocationInput = document.getElementById("holidayLocationInput");
  const roundClockInput = document.getElementById("roundClockInput");
  const contractedHoursInput = document.getElementById("contractedHoursInput");
  const totalHoursEl = document.getElementById("totalHours");
  const totalPayEl = document.getElementById("totalPay");

  function migrateDay(day){
    if(!day.mode){
      day.mode = day.on ? "work" : "off";
      delete day.on;
    }
    if(day.holidayHours === undefined) day.holidayHours = 7.5;
    return day;
  }

  function loadState(){
    try{
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(saved && saved.days && saved.rate){
        DAY_NAMES.forEach(name=>{
          saved.days[name] = migrateDay(saved.days[name] || JSON.parse(JSON.stringify(DEFAULTS[name])));
        });
        if(saved.includeLocationOnHoliday === undefined) saved.includeLocationOnHoliday = true;
        if(saved.roundClockTimes === undefined) saved.roundClockTimes = true;
        return saved;
      }
    }catch(e){}
    return { rate: 15.01, location: 0.90, includeLocationOnHoliday: true, roundClockTimes: true, contractedHours: "", days: JSON.parse(JSON.stringify(DEFAULTS)) };
  }

  let state = loadState();
  rateInput.value = state.rate;
  locationInput.value = state.location ?? 0.90;
  holidayLocationInput.checked = state.includeLocationOnHoliday !== false;
  document.getElementById("weekStartInput").value = state.weekStart || "";
  document.getElementById("roundClockInput").checked = state.roundClockTimes !== false;
  contractedHoursInput.value = state.contractedHours || "";

  function timeToMinutes(t){
    if(!t) return null;
    const [h,m] = t.split(":").map(Number);
    return h*60+m;
  }

  // Tesco-style clocking: rounds to 15-minute blocks, but conservatively —
  // clocking IN only rounds down to the block if you're within 3 min late,
  // otherwise it rounds UP to the next block. Clocking OUT is the mirror:
  // it only rounds up to the block if you're within 3 min early, otherwise
  // it rounds DOWN to the last completed block.
  function roundClockIn(mins){
    const prior = Math.floor(mins/15)*15;
    const diff = mins - prior;
    return diff <= 3 ? prior : prior+15;
  }
  function roundClockOut(mins){
    const prior = Math.floor(mins/15)*15;
    const next = prior+15;
    const diffToNext = next - mins;
    return diffToNext <= 3 ? next : prior;
  }

  function minutesToTime(mins){
    mins = ((mins%1440)+1440)%1440;
    const h = Math.floor(mins/60);
    const m = mins%60;
    return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  }

  // Tesco's 4-weekly pay cycle, confirmed against the actual Work & Pay schedule:
  // each period runs Sunday to Saturday (28 days), cut-off is the Friday 7 days
  // before payday, and payday is the Friday of the period's final week (the day
  // before the period technically closes). Anchor: period starting 19 Jul 2026
  // (Tax Week 20, 2026) ran to 15 Aug 2026, cut-off 7 Aug, paid 14 Aug 2026.
  // Note: around Christmas/New Year, Tesco sometimes brings payday forward a
  // day or two to avoid a bank holiday — always double-check Work & Pay then.
  const PAY_PERIOD_ANCHOR_UTC_DAYS = Date.UTC(2026,6,19)/86400000; // 19 Jul 2026

  function utcDayNum(dateObj){
    return Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate())/86400000;
  }
  function dayNumToDate(dayNum){
    return new Date(dayNum*86400000);
  }
  function computePayPeriod(dateObj){
    const dayNum = utcDayNum(dateObj);
    const diff = dayNum - PAY_PERIOD_ANCHOR_UTC_DAYS;
    const periodIndex = Math.floor(diff/28);
    const startDay = PAY_PERIOD_ANCHOR_UTC_DAYS + periodIndex*28;
    return {
      index: periodIndex,
      start: dayNumToDate(startDay),
      end: dayNumToDate(startDay+27),
      cutoff: dayNumToDate(startDay+19),
      payday: dayNumToDate(startDay+26),
    };
  }
  function fmtDateUTC(d, opts){
    return d.toLocaleDateString("en-GB", { timeZone:"UTC", ...opts });
  }

  function paidClockTimes(day){
    let startM = timeToMinutes(day.start);
    let endM = timeToMinutes(day.end);
    if(startM === null || endM === null) return null;
    let endAdj = endM < startM ? endM+24*60 : endM;
    if(state.roundClockTimes){
      startM = roundClockIn(startM);
      endAdj = roundClockOut(endAdj);
    }
    return { startM, endM: endAdj };
  }

  function dayHours(day){
    const t = paidClockTimes(day);
    if(!t) return 0;
    let diff = t.endM - t.startM;
    diff -= (Number(day.brk)||0);
    return Math.max(diff,0)/60;
  }

  function fmtHours(h){
    return h.toFixed(2).replace(/\.00$/,".0");
  }

  function render(){
    state.roundClockTimes = roundClockInput.checked;
    daysEl.innerHTML = "";
    DAY_NAMES.forEach(name=>{
      const day = state.days[name];
      const mode = day.mode;
      const workHours = mode === "work" ? dayHours(day) : 0;
      const holHours = mode === "holiday" ? (Number(day.holidayHours)||0) : 0;

      const card = document.createElement("div");
      card.className = "day" + (mode === "off" ? " off" : "") + (mode === "holiday" ? " holiday" : "");

      const modeSwitch = `
        <div class="mode-switch">
          <button type="button" data-day="${name}" data-mode="off" class="${mode==='off'?'active':''}">Off</button>
          <button type="button" data-day="${name}" data-mode="work" class="${mode==='work'?'active':''}">Work</button>
          <button type="button" data-day="${name}" data-mode="holiday" class="${mode==='holiday'?'active':''}">Holiday</button>
        </div>`;

      let hoursLabel = "Off";
      if(mode==="work") hoursLabel = fmtHours(workHours)+" hrs";
      if(mode==="holiday") hoursLabel = fmtHours(holHours)+" hrs holiday";

      let body = "";
      if(mode === "work"){
        const paid = paidClockTimes(day) || { startM:0, endM:0 };
        const barLeft = (paid.startM/1440*100).toFixed(2);
        const barWidth = Math.max(((paid.endM-paid.startM)/1440*100),1).toFixed(2);
        const rawStartM = timeToMinutes(day.start);
        const rawEndAdj = (timeToMinutes(day.end) < rawStartM) ? timeToMinutes(day.end)+24*60 : timeToMinutes(day.end);
        const roundedDiffers = state.roundClockTimes && (paid.startM !== rawStartM || paid.endM !== rawEndAdj);
        const paidNote = roundedDiffers
          ? `<div style="font-size:11px;color:var(--muted);margin-top:-4px;margin-bottom:8px;">Rounds to paid time: <span style="color:var(--teal);">${minutesToTime(paid.startM)}–${minutesToTime(paid.endM)}</span></div>`
          : "";
        body = `
          <div class="day-fields">
            <div class="field">
              <label>Start</label>
              <input type="time" data-day="${name}" data-field="start" value="${day.start}">
            </div>
            <div class="field">
              <label>Finish</label>
              <input type="time" data-day="${name}" data-field="end" value="${day.end}">
            </div>
            <div class="field">
              <label>Unpaid break (min)</label>
              <input type="number" class="brk" min="0" step="5" data-day="${name}" data-field="brk" value="${day.brk}">
            </div>
          </div>
          ${paidNote}
          <div class="bar">
            <div class="bar-ticks"><span></span><span></span><span></span><span></span></div>
            <div class="bar-fill" style="left:${barLeft}%;width:${barWidth}%"></div>
          </div>`;
      }else if(mode === "holiday"){
        body = `
          <div class="day-fields">
            <div class="field">
              <label>Holiday hours</label>
              <input type="number" class="holiday-hrs" min="0" step="0.5" data-day="${name}" data-field="holidayHours" value="${day.holidayHours}">
            </div>
          </div>
          <div class="holiday-bar">Paid Holiday</div>`;
      }

      card.innerHTML = `
        <div class="day-top">
          <div class="day-name">${name}</div>
          ${modeSwitch}
        </div>
        <div class="day-hours" style="margin-bottom:8px;">${hoursLabel}</div>
        ${body}
      `;
      daysEl.appendChild(card);
    });

    // totals
    let workedHours = 0, holidayHours = 0;
    DAY_NAMES.forEach(name=>{
      const day = state.days[name];
      if(day.mode === "work") workedHours += dayHours(day);
      if(day.mode === "holiday") holidayHours += (Number(day.holidayHours)||0);
    });
    const totalHours = workedHours + holidayHours;
    const rate = Number(rateInput.value)||0;
    const location = Number(locationInput.value)||0;
    const includeHolLocation = holidayLocationInput.checked;

    const basePay = totalHours*rate;
    const locationPay = workedHours*location + (includeHolLocation ? holidayHours*location : 0);
    const totalPay = basePay+locationPay;

    totalHoursEl.textContent = fmtHours(totalHours);
    document.getElementById("hoursBreakdown").textContent =
      holidayHours > 0 ? `${fmtHours(workedHours)} worked + ${fmtHours(holidayHours)} holiday` : "";
    totalPayEl.textContent = "£" + totalPay.toFixed(2);
    document.getElementById("payBreakdown").textContent =
      `£${basePay.toFixed(2)} base + £${locationPay.toFixed(2)} location`;

    state.includeLocationOnHoliday = includeHolLocation;
    state.contractedHours = contractedHoursInput.value;

    const contracted = Number(contractedHoursInput.value)||0;
    const banner = document.getElementById("contractedBanner");
    if(contracted > 0){
      const diff = totalHours - contracted;
      const absDiff = Math.abs(diff);
      let cls, msg;
      if(Math.abs(diff) < 0.05){
        cls = "match";
        msg = "Right on your contracted hours.";
      }else if(diff > 0){
        cls = "over";
        msg = `Over your contracted ${fmtHours(contracted)} hrs by <span class="cb-value">${fmtHours(absDiff)} hrs</span>.`;
      }else{
        cls = "under";
        msg = `Under your contracted ${fmtHours(contracted)} hrs by <span class="cb-value">${fmtHours(absDiff)} hrs</span>.`;
      }
      banner.className = "contracted-banner " + cls;
      banner.innerHTML = `<span>${msg}</span><span class="cb-value">${fmtHours(totalHours)} / ${fmtHours(contracted)} hrs</span>`;
      banner.style.display = "flex";
    }else{
      banner.style.display = "none";
    }

    save();
  }

  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){}
  }

  daysEl.addEventListener("click", e=>{
    const btn = e.target.closest("button[data-mode]");
    if(!btn) return;
    const dayName = btn.dataset.day;
    const newMode = btn.dataset.mode;
    const day = state.days[dayName];
    if(newMode === "holiday" && day.mode !== "holiday"){
      // Prefill holiday hours from this day's own shift pattern (start/end/break)
      const shiftHours = dayHours(day);
      day.holidayHours = shiftHours > 0 ? shiftHours : (day.holidayHours || 4.5);
    }
    day.mode = newMode;
    render();
  });

  daysEl.addEventListener("change", e=>{
    const t = e.target;
    const dayName = t.dataset.day;
    const field = t.dataset.field;
    if(!dayName || !field) return;
    if(field === "brk" || field === "holidayHours"){
      state.days[dayName][field] = t.value;
    }else{
      state.days[dayName][field] = t.value;
    }
    render();
  });

  holidayLocationInput.addEventListener("change", ()=>{
    state.includeLocationOnHoliday = holidayLocationInput.checked;
    render();
  });

  roundClockInput.addEventListener("change", ()=>{
    state.roundClockTimes = roundClockInput.checked;
    render();
  });

  contractedHoursInput.addEventListener("input", ()=>{
    state.contractedHours = contractedHoursInput.value;
    render();
  });

  rateInput.addEventListener("input", ()=>{
    state.rate = rateInput.value;
    render();
  });

  locationInput.addEventListener("input", ()=>{
    state.location = locationInput.value;
    render();
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    state = { rate: rateInput.value || 15.01, location: locationInput.value || 0.90, includeLocationOnHoliday: holidayLocationInput.checked, roundClockTimes: roundClockInput.checked, contractedHours: contractedHoursInput.value, days: JSON.parse(JSON.stringify(DEFAULTS)) };
    Object.keys(state.days).forEach(d => state.days[d].mode = "off");
    render();
  });

  document.getElementById("weekStartInput").addEventListener("input", e=>{
    state.weekStart = e.target.value;
    save();
    renderPayPeriod();
  });

  function referenceDateForPeriod(){
    const v = document.getElementById("weekStartInput").value;
    if(v) return new Date(v+"T00:00:00");
    return new Date();
  }

  function renderPayPeriod(){
    const period = computePayPeriod(referenceDateForPeriod());
    const opts = { day:"numeric", month:"short" };
    const rangeText = `${fmtDateUTC(period.start,opts)} – ${fmtDateUTC(period.end,{...opts, year:"numeric"})}`;
    document.getElementById("ppRange").textContent = rangeText;
    document.getElementById("ppCutoff").textContent = fmtDateUTC(period.cutoff,{weekday:"short",day:"numeric",month:"short"});
    document.getElementById("ppPayday").textContent = fmtDateUTC(period.payday,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
  }

  document.getElementById("ppPrev").addEventListener("click", ()=>{
    const d = referenceDateForPeriod();
    d.setDate(d.getDate()-28);
    const iso = d.toISOString().slice(0,10);
    document.getElementById("weekStartInput").value = iso;
    state.weekStart = iso;
    save();
    renderPayPeriod();
  });

  document.getElementById("ppNext").addEventListener("click", ()=>{
    const d = referenceDateForPeriod();
    d.setDate(d.getDate()+28);
    const iso = d.toISOString().slice(0,10);
    document.getElementById("weekStartInput").value = iso;
    state.weekStart = iso;
    save();
    renderPayPeriod();
  });

  function buildSummaryText(){
    const rate = Number(rateInput.value)||0;
    const location = Number(locationInput.value)||0;
    const includeHolLocation = holidayLocationInput.checked;
    let workedHours = 0, holidayHours = 0;
    const lines = [];

    DAY_NAMES.forEach(name=>{
      const day = state.days[name];
      if(day.mode === "work"){
        const h = dayHours(day);
        workedHours += h;
        const brk = Number(day.brk)||0;
        const brkTxt = brk ? ` (-${brk}min break)` : "";
        const paid = paidClockTimes(day);
        const paidTxt = (state.roundClockTimes && paid) ? ` [paid ${minutesToTime(paid.startM)}-${minutesToTime(paid.endM)}]` : "";
        lines.push(`${name.padEnd(10)} ${day.start}-${day.end}${brkTxt}${paidTxt}  ->  ${fmtHours(h)} hrs`);
      }else if(day.mode === "holiday"){
        const h = Number(day.holidayHours)||0;
        holidayHours += h;
        lines.push(`${name.padEnd(10)} Paid holiday  ->  ${fmtHours(h)} hrs`);
      }else{
        lines.push(`${name.padEnd(10)} Off`);
      }
    });

    const totalHours = workedHours + holidayHours;
    const basePay = totalHours*rate;
    const locationPay = workedHours*location + (includeHolLocation ? holidayHours*location : 0);
    const total = basePay+locationPay;
    const weekStart = state.weekStart ? new Date(state.weekStart+"T00:00:00") : null;
    const weekLabel = weekStart
      ? "Week starting " + weekStart.toLocaleDateString("en-GB",{ day:"numeric", month:"long", year:"numeric" })
      : "Weekly Earnings";

    const hoursLine = holidayHours > 0
      ? `Total hours: ${fmtHours(totalHours)} (${fmtHours(workedHours)} worked + ${fmtHours(holidayHours)} holiday)`
      : `Total hours: ${fmtHours(totalHours)}`;

    const contracted = Number(contractedHoursInput.value)||0;
    let contractedLine = "";
    if(contracted > 0){
      const diff = totalHours - contracted;
      if(Math.abs(diff) < 0.05) contractedLine = `Contracted hours: ${fmtHours(contracted)} — right on target`;
      else if(diff > 0) contractedLine = `Contracted hours: ${fmtHours(contracted)} — over by ${fmtHours(diff)} hrs`;
      else contractedLine = `Contracted hours: ${fmtHours(contracted)} — under by ${fmtHours(Math.abs(diff))} hrs`;
    }

    const period = computePayPeriod(referenceDateForPeriod());
    const dOpts = { day:"numeric", month:"short", year:"numeric" };
    const periodLine = `Pay period: ${fmtDateUTC(period.start,dOpts)} – ${fmtDateUTC(period.end,dOpts)}  |  Cut-off: ${fmtDateUTC(period.cutoff,dOpts)}  |  Pay date: ${fmtDateUTC(period.payday,dOpts)}`;

    return [
      weekLabel,
      periodLine,
      "",
      ...lines,
      "",
      hoursLine,
      ...(contractedLine ? [contractedLine] : []),
      `Rate: £${rate.toFixed(2)}/hr + £${location.toFixed(2)}/hr location`,
      `Base pay: £${basePay.toFixed(2)}`,
      `Location pay: £${locationPay.toFixed(2)}`,
      `Total pay: £${total.toFixed(2)}`,
    ].join("\n");
  }

  function showHint(msg){
    const el = document.getElementById("exportHint");
    el.textContent = msg;
    setTimeout(()=>{ if(el.textContent===msg) el.textContent = ""; }, 3000);
  }

  document.getElementById("shareBtn").addEventListener("click", async ()=>{
    const text = buildSummaryText();
    if(navigator.share){
      try{
        await navigator.share({ title: "Weekly Earnings", text });
        return;
      }catch(err){
        if(err && err.name === "AbortError") return; // user cancelled
      }
    }
    try{
      await navigator.clipboard.writeText(text);
      showHint("Copied - paste into Notes or anywhere you like.");
    }catch(err){
      showHint("Couldn't open the share sheet or copy - try Download instead.");
    }
  });

  document.getElementById("downloadBtn").addEventListener("click", ()=>{
    const text = buildSummaryText();
    const weekStart = state.weekStart || "week";
    const blob = new Blob([text], { type:"text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `earnings-${weekStart}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showHint('Downloaded - on iPhone, choose "Save to Files" when prompted.');
  });

  render();
  renderPayPeriod();
</script>
</body>
</html>
